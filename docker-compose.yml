services:
  calendario:
    build: .
    container_name: calendario
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - calendario-data:/app/data
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/database.db

volumes:
  calendario-data:
